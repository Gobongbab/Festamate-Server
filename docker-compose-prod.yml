# 운영용
services:
  app:
    container_name: festamate
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: gobongbab/festamate:latest
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - USE_PROFILE=prod
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS} # CORS 허용 도메인 설정
    networks:
      - festamate-network
    depends_on:
      - redis-service

  # Redis 캐시 서버 설정
  redis-service:
    image: redis:latest
    container_name: ${REDIS_CONTAINER_NAME}
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} # Redis 비밀번호 설정
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_CONTAINER_NAME=${REDIS_CONTAINER_NAME}
      - TZ=Asia/Seoul
    volumes:
      - redis-dev-data:/data # Redis 데이터 영속성을 위한 볼륨
    networks:
      - festamate-network

volumes:
  redis-dev-data: # Redis 데이터 저장용 볼륨

networks:
  festamate-network: # 서비스 간 통신을 위한 브릿지 네트워크
    driver: bridge