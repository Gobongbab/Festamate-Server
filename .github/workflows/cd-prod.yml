name: Java CD-Prod (via Bastion)

on:
  pull_request: # 테스트할 때 편하고자 PR 날렸을 때 이벤트가 발생하도록 했다.
    # 실제 운영할 때는 push로 바꿔줘야 함
    branches: [ main ] # 운영 브랜치 (main)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest #  GitHub Actions 워크플로우를 실행할 가상 머신의 운영체제를 지정하는 것, 이 설정은 워크플로우가 실행되는 환경일 뿐, 최종적으로 배포될 EC2 인스턴스의 운영체제와는 직접적인 관련이 없다.

    steps:
      # 1) 워크플로우가 실행되는 러너(가상 머신)에 해당 리포지토리의 코드를 클론하기 위해 사용
      - name: Checkout code
        uses: actions/checkout@v3

      # Gradle 의존성에 대한 캐싱 추가 (매 빌드마다 의존성을 다시 다운로드하게 되어 빌드 시간이 길어지는 걸 방지)
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 2) JDK 17 버전 설치, 다른 JDK 버전을 사용한다면 수정 필요
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3)권한 부여 >> 리눅스 명령어
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      # 4) .env 파일 생성, 생성하는 이유는 Docker Compose 빌드할 때 환경 변수를 사용하기 위해서다. 즉, runner에 .env파일을 만들어주는 것
      - name: Make .env file
        run: |
          # .env 파일 생성 및 환경 변수 추가
          echo "ENV=${{ secrets.ENV }}" > .env

      # 5) .build시작 >> 리눅스 명령어다.
      # 빌드와 테스트를 함께 실행
      - name: Build and Test with Gradle
        run: |
          ./gradlew clean build -x test
        shell: bash

      # 6) Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7) Docker Compose 빌드 및 푸시
      - name: Build and push with Docker Compose
        run: |
          # 서비스 이름을 태그에 포함시켜 이미지 빌드 및 푸시 (운영 환경에 맞는 docker-compose 파일 사용)
          docker compose -f docker-compose-dev.yml build
          docker compose -f docker-compose-dev.yml push

      # 8) 배포 파일들을 Bastion Host로 복사
      - name: Copy deployment files to Bastion Host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ${{ secrets.BASTION_USERNAME }}
          key: ${{ secrets.BASTION_PRIVATE_KEY }}
          source: "docker-compose-dev.yml,.env" # 쉼표로 구분된 파일 목록
          target: "/home/${{ secrets.BASTION_USERNAME }}/" # Bastion에 임시 저장될 디렉토리
          overwrite: true

      # 8) EC2에 배포 (Bastion Host 경유)
      - name: Deploy to EC2 (via Bastion Host)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BASTION_HOST }} # Bastion Host의 Public IP 또는 DNS
          username: ${{ secrets.BASTION_USERNAME }} # Bastion Host 접속 사용자 이름
          key: ${{ secrets.BASTION_PRIVATE_KEY }} # Bastion Host 접속 Private Key
          script: |
            BASTION_DEPLOY_DIR="/home/${{ secrets.BASTION_USERNAME }}/"
            EC2_HOME_DIR="/home/${{ secrets.PROD_EC2_USERNAME }}"
            EC2_USER_HOST="${{ secrets.PROD_EC2_USERNAME }}@${{ secrets.PROD_EC2_HOST }}"
            INTERNAL_KEY_PATH_ON_BASTION="${BASTION_DEPLOY_DIR}/festamate-prod-key.pem" # Bastion에 임시로 저장될 Private EC2 접속 키 경로

            echo "Deploying to Private EC2: ${EC2_USER_HOST} from Bastion"

            # 0. Bastion에 Private EC2 접속용 Private Key 임시 생성
            echo "${{ secrets.PROD_EC2_PRIVATE_KEY }}" > ${INTERNAL_KEY_PATH_ON_BASTION}
            chmod 600 ${INTERNAL_KEY_PATH_ON_BASTION}

            # 1. Bastion에서 Private EC2로 배포 파일들 복사
            echo "Copying files from Bastion to Private EC2..."
            scp -i ${INTERNAL_KEY_PATH_ON_BASTION} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              ${BASTION_DEPLOY_DIR}/docker-compose-dev.yml \
              ${BASTION_DEPLOY_DIR}/.env \
              ${EC2_USER_HOST}:${EC2_HOME_DIR}/

            # 2. Private EC2에서 배포 스크립트 실행
            echo "Executing deployment script on Private EC2..."
            ssh -i ${INTERNAL_KEY_PATH_ON_BASTION} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${EC2_USER_HOST} << 'EOFSSH'
              set -e # Private EC2에서도 오류 발생 시 즉시 중단
            
              cd /home/${{ secrets.PROD_EC2_USERNAME }}/ # 작업 디렉토리로 이동

              # Docker Hub 로그인
              echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

              echo "Pulling latest images from Docker Hub..."
              docker compose -f docker-compose-dev.yml pull

              echo "Taking down existing containers..."
              docker compose -f docker-compose-dev.yml down || true # 실패해도 다음 단계 진행 (처음 배포 시 컨테이너가 없을 수 있음)

              echo "Starting new containers..."
              docker compose -f docker-compose-dev.yml up -d

              echo "Pruning unused Docker images..."
              docker image prune -af

              echo "Deployment to Private EC2 complete."
            EOFSSH

            # 3. Bastion Host에 생성된 임시 Private Key 파일 및 배포 파일 정리
            echo "Cleaning up temporary files on Bastion Host..."
            rm -f ${INTERNAL_KEY_PATH_ON_BASTION}
            rm -rf ${BASTION_DEPLOY_DIR}

            echo "Bastion cleanup complete."
